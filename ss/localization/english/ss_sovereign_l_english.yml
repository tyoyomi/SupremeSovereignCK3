 ss_meditate_supreme_sovereign_decision_confirm:0 "Begin meditation"
 ss_meditate_supreme_sovereign_decision_effect_tt:0 "You become a Supreme Sovereign"
 ss_tt_can_meditate_for_sovereign:0 "You are a living player without Supreme Sovereign and have not already meditated"

 # Settings hub decision
 ss_manage_sovereign_settings_decision:0 "Manage Sovereign Settings"
 ss_manage_sovereign_settings_decision_desc:0 "Open the Sovereign Settings hub (5 pages). Page 1: Lifestyle, Longevity, Wealth, Prestige, Domain. Page 2: Keep Titles, Kingdom CB, Extra Conquests, Military, Schemes. Page 3: Influence, Legacy, Perk Gift, Reshape. Page 4: Empire Pulse, House Head, Languages, Hegemony CB. Page 5: Vassal Kids seat/land/gift.\n\nDone is always first. Click a setting to cycle its tier."
 ss_manage_sovereign_settings_decision_tooltip:0 "Open Sovereign Settings and view or cycle each tier"
 ss_manage_sovereign_settings_decision_confirm:0 "Open Settings"
 ss_manage_sovereign_settings_decision_effect_tt:0 "Opens the Sovereign Settings hub showing current tiers"

