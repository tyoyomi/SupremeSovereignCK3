 ss_tt_can_revoke_sovereign:0 "Target holds Supreme Sovereign and is you or your living child"

 # Meditate on the Mantle (CM-118)
 ss_meditate_supreme_sovereign_decision:0 "Meditate on the Mantle"
 ss_meditate_supreme_sovereign_decision_desc:0 "Through prayer and quiet resolve, claim the Supreme Sovereign mantle yourself.\n\nUse this when no living parent granted the blessing. Costs piety. You may meditate only once — Revoke does not restore this path; a living parent can still Grant it later."
