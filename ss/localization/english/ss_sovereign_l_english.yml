 ss_revoke_supreme_sovereign_interaction_desc:0 "Take the Supreme Sovereign mantle back from [recipient.GetShortUIName]. They lose Sovereign powers — Settings, Actions, and the blessing itself."
 ss_revoke_supreme_sovereign_interaction_extra_icon:0 "$ss_revoke_supreme_sovereign_interaction$"

