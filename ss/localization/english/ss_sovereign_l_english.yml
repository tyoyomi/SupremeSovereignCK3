 ss_settings.tt.hegemony_conquest:0 "Hegemony Conquest CB — one rung beyond Extra Conquests. Seize a neighboring hegemony's de jure land.\n\nOn (1): Hegemony Conquest appears when All Under Heaven is present.\nOff (0): hidden.\n\nPlayer-only; 4000 gold + 4000 prestige to declare; repeatable. Not folded into Extra Conquests. Pairs with Keep All Titles.\n\nClick to cycle On ↔ Off."
 ss_settings.tt.vassal_kids_seat:0 "Vassal Kids Seat Cap — how many children enter the distribute seat ring (heir first, then oldest).\n\nAll (0): every eligible child.\n2 / 4 / 6: hard cap on recipients.\n\nClick to cycle All → 2 → 4 → 6 → All."
 ss_settings.tt.vassal_kids_land:0 "Vassal Kids Land Mode — which below-rank titles Distribute may grant.\n\nAll (0): current below-tier pool.\nDuchies only (1): duchies alone (no county steal).\nCounties only (2): excess counties only.\n\nClick to cycle All → Duchies → Counties → All."
 ss_settings.tt.vassal_kids_gift:0 "Vassal Kids Opinion Gift — mild temporary opinion after Distribute.\n\nOn (1): each landed child gains a thank-you opinion.\nOff (0): no gift.\n\nClick to cycle On ↔ Off."
