 ss_grant_supreme_sovereign_interaction_extra_icon:0 "$ss_grant_supreme_sovereign_interaction$"

 ss_tt_actor_may_grant:0 "You are a Supreme Sovereign and may grant the blessing"
 ss_tt_can_receive_sovereign:0 "Target is your living child without Supreme Sovereign"

 # Settings hub decision
 ss_manage_sovereign_settings_decision:0 "Manage Sovereign Settings"
 ss_manage_sovereign_settings_decision_desc:0 "Open the Sovereign Settings hub (3 pages). Page 1: Lifestyle, Longevity, Wealth, Prestige, Domain. Page 2: Keep Titles, Kingdom CB, Extra Conquests, Military, Schemes. Page 3: Influence, Legacy, Perk Gift, Reshape.\n\nDone is always first. Click a setting to cycle its tier."
 ss_manage_sovereign_settings_decision_tooltip:0 "Open Sovereign Settings and view or cycle each tier"
 ss_manage_sovereign_settings_decision_confirm:0 "Open Settings"
 ss_manage_sovereign_settings_decision_effect_tt:0 "Opens the Sovereign Settings hub showing current tiers"

 # Settings hub event (paged — keep option counts GUI-safe)
 ss_settings.1001.t:0 "Sovereign Settings (1/3)"
 ss_settings.1001.desc_intro:0 "Page 1 — core tiers. Click a setting to cycle; Done stays at the top."
 ss_settings.1001.desc_blank:0 "\n"
 ss_settings.1001.desc_footer:0 "More opens war and legacy pages. Perk claims stay on Decisions."
 ss_settings.1001.close:0 "Done"
 ss_settings.1001.more:0 "More…"
 ss_settings.1002.t:0 "Sovereign Settings (2/3)"
 ss_settings.1002.desc_intro:0 "Page 2 — titles, conquest, military, schemes."
 ss_settings.1002.desc_footer:0 "More opens legacy / perk / reshape. Done closes the hub."
 ss_settings.1002.close:0 "Done"
 ss_settings.1002.more:0 "More…"
 ss_settings.1003.t:0 "Sovereign Settings (3/3)"
 ss_settings.1003.desc_intro:0 "Page 3 — influence, legacy pulse, perk gift, reshape heir."
 ss_settings.1003.desc_footer:0 "Back returns to page 1. Grant Sovereign and Reshape Heir are character interactions."
 ss_settings.1003.close:0 "Done"
 ss_settings.1003.back:0 "Back"
 # Hub option hover tooltips (current effect + cycle)
 ss_settings.tt.lifestyle:0 "Lifestyle XP — Sovereign monthly lifestyle experience multiplier.\n\nOff (0): no Sovereign XP bonus (other XP sources unchanged).\nLow (1): ×2 lifestyle XP.\nMedium (2): ×5 lifestyle XP.\nHigh (3): ×10 lifestyle XP.\n\nClick to cycle Off → Low → Medium → High → Off. Your current tier is on the button."
 ss_settings.tt.longevity:0 "Longevity — extraordinary long life (not immortality): health, vitality, fertility years.\n\nLow (1): health +25, fertility +25, +50 fertility years.\nMedium (2): health +50, fertility +50, +100 fertility years.\nHigh (3): health +100, fertility +75, +150 fertility years.\n\nFertility is capped to limit court bloat. Click to cycle Low → Medium → High → Low. Your current tier is on the button."
 ss_settings.tt.wealth:0 "Wealth — monthly gold income and piety from the Sovereign blessing.\n\nLow (1): +25 income, +15 piety / month.\nMedium (2): +50 income, +25 piety / month.\nHigh (3): +75 income, +40 piety / month.\n\nAnything beyond these caps banks silently into your Sovereign reserve and drips back over the years (no extra UI).\n\nClick to cycle Low → Medium → High → Low. Your current tier is on the button."
 ss_settings.tt.prestige:0 "Prestige — monthly personal prestige and dynasty prestige from the Sovereign blessing.\n\nLow (1): +20 prestige, +50 dynasty prestige / month.\nMedium (2): +50 prestige, +100 dynasty prestige / month.\nHigh (3): +100 prestige, +200 dynasty prestige / month.\n\nExcess beyond these caps banks silently into your Sovereign reserve and drips back over the years.\n\nClick to cycle Low → Medium → High → Low. Your current tier is on the button."
 ss_settings.tt.domain:0 "Domain & Vassals — extra domain limit and vassal limit from the Sovereign blessing.\n\nLow (1): +10 domain, +25 vassals.\nMedium (2): +25 domain, +50 vassals.\nHigh (3): +50 domain, +100 vassals.\n\nApplies only while Keep All Titles is Off. Click to cycle Low → Medium → High → Low. Your current tier is on the button."
 ss_settings.tt.unlimited_titles:0 "Keep All Titles — hold every duchy and domain without title-count punishment.\n\nWhile Supreme Sovereign is in the playset, too-many-duchies opinion and \"liege holds my duchy\" opinion are disabled for all kings/emperors (engine defines; turning this Off mid-game cannot restore them — unload the mod).\n\nOn (1): +200 domain limit and +200 vassal limit for you (Domain & Vassals tiers are skipped).\nOff (0): domain/vassal bonuses revert to your Domain & Vassals tier.\n\nPairs well with Kingdom Conquest after large takes. Click to cycle On ↔ Off. Your current value is on the button."
 ss_settings.tt.kingdom_conquest:0 "Kingdom Conquest CB — When On, Sovereign may declare Kingdom Conquest on a neighboring kingdom and seize its de jure titles on victory.\n\nOn (1): Kingdom Conquest appears on the declare-war screen for you.\nOff (0): the CB is hidden.\n\nPlayer-only; no piety or prestige cost; repeatable. Pairs with Keep All Titles after large takes.\n\nClick to cycle On ↔ Off. Your current value is on the button."
 ss_settings.tt.extra_conquests:0 "Extra Conquests — When On, Sovereign may use Duchy Conquest, Empire Conquest, Realm Annex, and Faith Conquest.\n\nOn (1): the four Extra Conquest CBs appear on the declare-war screen for you.\nOff (0): all four are hidden.\n\nPlayer-only; no piety or prestige cost; repeatable. Kingdom Conquest stays on its own toggle. Pairs with Keep All Titles after empire or realm takes.\n\nClick to cycle On ↔ Off. Your current value is on the button."
 ss_settings.tt.military:0 "Military — combat advantage, sieges, supply, levies, knights, and men-at-arms package.\n\nLow (1): mild battlefield and levy boosts.\nMedium (2): strong advantage, MAA, and reinforcement.\nHigh (3): overwhelming combat, levy, knight, and MAA bonuses.\n\nClick to cycle Low → Medium → High → Low. Your current tier is on the button."
 ss_settings.tt.schemes:0 "Schemes — scheme success, secrecy, enemy-scheme defense, and max scheme slots.\n\nLow (1): +50 success/secrecy, −25 enemy success, +3 personal and hostile scheme slots.\nMedium (2): +100 success/secrecy, −50 enemy success, +5 slots each.\nHigh (3): +200 success/secrecy, −75 enemy success, +10 slots each.\n\nSlot counts are capped so concurrent schemes stay cheap to simulate. Click to cycle Low → Medium → High → Low. Your current tier is on the button."
 ss_settings.tt.influence:0 "Influence — monthly Influence currency (Roads to Power / All Under Heaven).\n\nOff (0): no Sovereign Influence gain.\nLow (1): +5 Influence / month.\nMedium (2): +15 Influence / month.\nHigh (3): +40 Influence / month.\n\nModifiers apply only when EP3 or TGP DLC is present. Spending Influence still requires a government that uses it (for example Administrative).\n\nClick to cycle Off → Low → Medium → High → Off. Your current tier is on the button."
 ss_settings.tt.legacy:0 "Legacy Pulse — every five years: personal prestige, dynasty renown, and favor hooks on vassals or councillors.\n\nOff (0): no pulses.\nLow (1): modest prestige/renown, up to 1 favor hook.\nMedium (2): strong pulse, up to 2 hooks.\nHigh (3): massive pulse, up to 3 hooks.\n\nClick to cycle Off → Low → Medium → High → Off. Your current tier is on the button."
 ss_settings.tt.perk:0 "Perk Gift Size — free lifestyle perk points from Claim decisions on the Decisions menu (yearly cooldown).\n\nOff (0): claim decisions hidden.\n1 point (1): each claim grants 1 perk point.\n3 points (2): each claim grants 3; unlocks Claim All Lifestyles.\n5 points (3): each claim grants 5; Claim All remains available.\n\nClick to cycle Off → 1 → 3 → 5 → Off. Your current tier is on the button."
 ss_settings.tt.reshape:0 "Reshape Heir Power — once-per-lifetime character interaction on a child (does not grant Supreme Sovereign).\n\nOff (0): interaction hidden.\nXP only (1): large lifestyle XP to all five lifestyles.\nXP + claims (2): XP plus copies your claims onto the child.\nFull (3): XP, claims, and free perk points per lifestyle.\n\nClick to cycle Off → XP → XP+Claims → Full → Off. Your current tier is on the button."
 ss_settings.tt.close:0 "Close the Sovereign Settings hub without changing anything."
 ss_settings.tt.more:0 "Open the next settings page."
 ss_settings.tt.back:0 "Return to the first settings page."

