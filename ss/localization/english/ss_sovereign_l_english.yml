 # Grant interaction (Option A)
 ss_grant_supreme_sovereign_interaction:0 "Grant Supreme Sovereign"
 ss_grant_supreme_sovereign_interaction_desc:0 "Bestow the Supreme Sovereign blessing upon [recipient.GetShortUIName], your child. They do not inherit it automatically — you choose who carries the mantle."
